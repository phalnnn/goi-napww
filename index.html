<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WuWa Topup Hub - Kho acc của Chía</title>
    
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
    
    <!-- Supabase Client JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            void: '#030305',
                            black: '#07070b',
                            dark: '#0d0d14',
                            panel: '#12121c',
                            card: '#161624',
                            cyan: '#00f0ff',
                            neonYellow: '#fcee0a'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #040407;
            color: #f8fafc;
            font-size: 15px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .cyber-font { font-family: 'Orbitron', monospace; letter-spacing: 0.06em; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .cyber-ambient-bg {
            background-color: #040407;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
        .cyber-cut-btn { clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%); }
        .wuwa-panel-glow {
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.12), inset 0 0 15px rgba(0, 240, 255, 0.04);
            transition: all 0.3s ease;
        }
        .wuwa-panel-glow:hover {
            border-color: rgba(0, 240, 255, 0.85);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 240, 255, 0.08);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #040407; }
        ::-webkit-scrollbar-thumb { background: #00f0ff; border-radius: 2px; }
    </style>
</head>
<body class="cyber-ambient-bg min-h-screen flex flex-col justify-between selection:bg-cyan-400 selection:text-black">

    <!-- Header HUD -->
    <header class="sticky top-0 z-40 bg-[#06060a]/90 backdrop-blur-xl border-b border-cyan-500/30 px-3 sm:px-6 lg:px-8 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3.5">
                <div class="relative w-12 h-12 bg-cyan-950/50 border border-cyan-400/80 rounded-xl flex items-center justify-center shadow-[0_0_20px_rgba(0,240,255,0.5)] flex-shrink-0">
                    <i class="fa-solid fa-gem text-cyan-400 text-xl"></i>
                    <span class="absolute -top-1 -right-1 w-3 h-3 bg-yellow-400 rounded-full shadow-[0_0_10px_#fcee0a]"></span>
                </div>
                <div>
                    <h1 class="cyber-font text-lg sm:text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-200 to-yellow-300">
                        WUWA TOPUP HUB
                    </h1>
                    <span class="text-[11px] font-bold text-zinc-400 tracking-wider mono-font">BẢNG GIÁ NẠP WUTHERING WAVES</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <div class="flex items-center px-3.5 py-1.5 rounded-lg bg-zinc-900 border border-cyan-500/50 text-xs font-semibold">
                    <span class="text-zinc-400 mr-1.5">TỔNG GÓI:</span>
                    <span id="headerTotalCount" class="text-cyan-400 font-black cyber-font text-sm sm:text-base">0</span>
                </div>
                <button type="button" onclick="openWuwaModal()" 
                    class="cyber-cut-btn items-center justify-center px-4 py-2 text-xs cyber-font font-black uppercase tracking-wider text-black bg-gradient-to-r from-cyan-400 via-teal-300 to-cyan-400 hover:from-cyan-300 transition shadow-[0_0_20px_rgba(0,240,255,0.7)] active:scale-95">
                    <i class="fa-solid fa-plus mr-1"></i> THÊM GÓI
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-6 w-full flex-1">
        <!-- Search Bar -->
        <div class="mb-6 p-4 rounded-xl bg-[#090910]/95 border border-cyan-950/90 shadow-[0_0_25px_rgba(0,240,255,0.08)] flex items-center">
            <div class="relative w-full flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-cyan-400 text-base"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="TÌM KIẾM TÊN GÓI NẠP, LUNITES..."
                    class="w-full pl-12 pr-12 py-2.5 bg-black/80 border border-zinc-700/80 focus:border-cyan-400 rounded-xl text-sm sm:text-base text-zinc-100 placeholder-zinc-500 font-semibold focus:outline-none transition">
                <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Grid Cards -->
        <div id="wuwaGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20 px-4">
            <div class="relative w-24 h-24 mx-auto mb-4 rounded-2xl bg-zinc-950 border-2 border-cyan-400/40 flex items-center justify-center text-cyan-400 text-4xl shadow-[0_0_30px_rgba(0,240,255,0.25)]">
                <i class="fa-solid fa-gem"></i>
            </div>
            <h3 class="cyber-font text-lg sm:text-xl text-zinc-100 font-black mb-2 tracking-wider">CHƯA CÓ GÓI NẠP NÀO</h3>
            <p class="text-sm text-zinc-400 max-w-md mx-auto mb-6 leading-relaxed">Hãy bấm nút "THÊM GÓI" phía trên để tạo bảng giá nạp game lên hệ thống Supabase.</p>
        </div>
    </main>

    <!-- Modal Thêm / Sửa Gói Nạp -->
    <div id="wuwaModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-3 sm:p-4 overflow-y-auto">
        <div class="relative w-full max-w-lg bg-[#080b12] border-2 border-cyan-400 rounded-2xl shadow-[0_0_50px_rgba(0,240,255,0.35)] overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-5 py-3.5 border-b border-cyan-950 bg-zinc-950 flex-shrink-0">
                <div class="flex items-center space-x-2.5 truncate">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_10px_#00f0ff] animate-pulse"></span>
                    <h2 id="modalHeading" class="cyber-font text-xs sm:text-base font-black text-cyan-400 tracking-wider">
                        THÊM GÓI NẠP // <span class="text-zinc-100">BẢNG GIÁ</span>
                    </h2>
                </div>
                <button type="button" onclick="closeWuwaModal()" class="w-8 h-8 rounded-lg bg-zinc-900 border border-zinc-700 hover:border-cyan-400 text-zinc-300 hover:text-white flex items-center justify-center transition active:scale-95">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="wuwaForm" onsubmit="handleFormSubmit(event)" class="flex-1 overflow-y-auto p-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-zinc-200 mb-1">
                        <i class="fa-solid fa-gem text-cyan-400 mr-1"></i> TÊN GÓI NẠP:
                    </label>
                    <input type="text" id="pkgTitle" required placeholder="Ví dụ: Lunite Subscription (Thẻ Tháng)..."
                        class="w-full px-3.5 py-2.5 bg-black/80 border-2 border-zinc-700 focus:border-cyan-400 rounded-xl text-sm text-cyan-200 font-bold focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-200 mb-1">
                        <i class="fa-solid fa-tag text-yellow-400 mr-1"></i> GIÁ BÁN (VNĐ):
                    </label>
                    <input type="number" id="pkgPrice" min="0" step="1000" required placeholder="Ví dụ: 109000"
                        class="w-full px-3.5 py-2.5 bg-black/80 border border-zinc-700 focus:border-yellow-400 rounded-xl text-base text-yellow-300 font-black focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-200 mb-1.5">
                        <i class="fa-solid fa-image text-cyan-400 mr-1"></i> ẢNH MINH HOẠ:
                    </label>
                    <label class="w-full p-4 border-2 border-dashed border-zinc-700 hover:border-cyan-400 rounded-xl bg-black/60 flex flex-col items-center justify-center cursor-pointer transition">
                        <i class="fa-solid fa-cloud-arrow-up text-cyan-400 text-2xl mb-1.5"></i>
                        <span class="text-xs font-bold text-zinc-300">Nhấn để tải ảnh gói nạp lên</span>
                        <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    </label>
                    <div id="imgPreviewContainer" class="hidden mt-2 relative w-full h-36 bg-black rounded-xl border border-cyan-500/40 overflow-hidden">
                        <img id="imgPreview" src="" class="w-full h-full object-contain">
                    </div>
                </div>
            </form>

            <div class="p-3 sm:p-4 bg-zinc-950 border-t border-zinc-800 flex-shrink-0">
                <button type="button" onclick="document.getElementById('wuwaForm').requestSubmit()" id="submitBtn"
                    class="w-full py-3 cyber-cut-btn bg-gradient-to-r from-cyan-400 via-teal-300 to-cyan-400 text-black font-black cyber-font text-xs uppercase tracking-widest shadow flex items-center justify-center gap-2 active:scale-95">
                    <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                    <span id="submitBtnText">LƯU GÓI NẠP LÊN SUPABASE</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Xác Nhận Xóa -->
    <div id="deleteModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="relative w-full max-w-md bg-[#0a0a10] border-2 border-red-600 rounded-2xl p-6 shadow text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-red-950/70 border-2 border-red-500 flex items-center justify-center text-red-500 text-3xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="cyber-font text-base font-black text-red-500 uppercase tracking-widest mb-1.5">CẢNH BÁO XÓA GÓI</h3>
            <p class="text-xs sm:text-sm text-zinc-300 mono-font mb-2">Hệ thống chuẩn bị xóa vĩnh viễn gói nạp này:</p>
            <div id="deletePkgLabel" class="cyber-font text-base font-bold text-yellow-400 bg-black/80 py-1.5 px-4 rounded-lg border border-yellow-500/50 inline-block mb-4">Gói</div>
            <div class="flex items-center justify-center space-x-3">
                <button type="button" onclick="closeDeleteModal()" class="flex-1 py-2.5 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-300 mono-font text-xs uppercase">HỦY BỎ</button>
                <button type="button" onclick="executeDelete()" class="flex-1 py-2.5 cyber-cut-btn bg-gradient-to-r from-red-600 to-rose-600 text-black font-black cyber-font text-xs uppercase shadow">XÁC NHẬN XÓA</button>
            </div>
        </div>
    </div>

    <!-- Modal Xem Ảnh Lớn -->
    <div id="imgModal" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-3 sm:p-4 hidden" onclick="closeImgViewer()">
        <div class="relative max-w-4xl max-h-[92vh] bg-black p-2 rounded-xl border-2 border-cyan-400 shadow" onclick="event.stopPropagation()">
            <button type="button" onclick="closeImgViewer()" class="absolute -top-3 -right-3 w-8 h-8 rounded-full bg-red-600 text-black font-black flex items-center justify-center hover:scale-110 transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="modalViewerImage" src="" alt="Chi tiết" class="max-w-full max-h-[86vh] object-contain rounded">
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-[80] translate-y-24 opacity-0 transition-all duration-300 pointer-events-none px-4 py-3 rounded-xl border mono-font text-xs flex items-center space-x-3 shadow-2xl backdrop-blur-md">
        <i id="toastIcon" class="fa-solid fa-check text-sm"></i>
        <span id="toastMsg" class="font-bold">Ready</span>
    </div>

    <script>
        const SUPABASE_URL = 'https://llijmkoztqthovvklamm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsaWpta296dHF0aG92dmtsYW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDQ1NzksImV4cCI6MjEwNjQyMDU3OX0.6ZyBSLuXhQNC-nm1nCBTEZMs5Y3FDE83xD8lvL0HRUk';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let wuwaPackages = [];
        let editingPkgId = null;
        let pendingDeleteId = null;
        let uploadedBase64Image = "";

        async function fetchPackages() {
            try {
                const { data, error } = await _supabase.from('wuwa_packages').select('*').order('price', { ascending: true });
                if (error) throw error;
                wuwaPackages = data || [];
                document.getElementById('headerTotalCount').textContent = wuwaPackages.length;
                renderList(wuwaPackages);
            } catch (err) {
                console.error("Lỗi tải dữ liệu:", err);
            }
        }

        function renderList(list) {
            const grid = document.getElementById('wuwaGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (list.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.classList.remove('hidden');

            list.forEach(pkg => {
                const card = document.createElement('div');
                const priceFormatted = (parseFloat(pkg.price) || 0) > 0 ? (parseFloat(pkg.price) || 0).toLocaleString('vi-VN') + 'đ' : 'Liên hệ';

                card.className = "relative bg-[#080d16] rounded-2xl flex flex-col justify-between transition-all duration-300 group wuwa-panel-glow border-cyan-950/90 hover:border-cyan-400";

                const imgHtml = pkg.image ? `
                    <div class="relative w-full h-48 bg-black overflow-hidden rounded-t-2xl cursor-pointer" onclick="openImgViewer('${pkg.image}')">
                        <img src="${pkg.image}" alt="${pkg.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute top-2.5 right-2.5 bg-black/90 text-xs font-black text-yellow-400 px-2.5 py-1 rounded-md border border-yellow-500/80 shadow">
                            ${priceFormatted}
                        </div>
                    </div>
                ` : `
                    <div class="relative w-full h-40 bg-[#05070c] flex flex-col items-center justify-center text-zinc-500 rounded-t-2xl">
                        <i class="fa-solid fa-gem text-4xl mb-2 text-cyan-400/30"></i>
                        <span class="text-xs font-bold text-cyan-400">WUWA HUB</span>
                        <div class="absolute top-2.5 right-2.5 bg-black/90 text-xs font-black text-yellow-400 px-2.5 py-1 rounded-md border border-yellow-500/80">
                            ${priceFormatted}
                        </div>
                    </div>
                `;

                card.innerHTML = `
                    <div class="absolute top-2.5 right-2.5 z-30 flex items-center space-x-1.5 bg-black/85 p-1 rounded-xl border border-zinc-800 shadow">
                        <button type="button" onclick="openEditModal('${pkg.id}')" class="w-7 h-7 rounded-lg bg-zinc-900 border border-cyan-500/50 text-cyan-300 flex items-center justify-center">
                            <i class="fa-solid fa-pen text-[11px]"></i>
                        </button>
                        <button type="button" onclick="promptDelete('${pkg.id}', '${escapeHtml(pkg.title)}')" class="w-7 h-7 rounded-lg bg-zinc-900 border border-red-500/60 text-red-400 flex items-center justify-center">
                            <i class="fa-solid fa-xmark text-xs font-black"></i>
                        </button>
                    </div>

                    ${imgHtml}

                    <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between space-y-3.5">
                        <div class="pb-2 border-b border-zinc-800">
                            <h3 class="cyber-font text-base sm:text-lg font-black text-cyan-300 tracking-wide">${escapeHtml(pkg.title)}</h3>
                            <div class="mt-1 flex items-center justify-between">
                                <span class="text-xs text-zinc-400">Giá bán:</span>
                                <span class="text-sm font-black text-yellow-400 bg-yellow-950/40 border border-yellow-500/50 px-2 py-0.5 rounded">${priceFormatted}</span>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-zinc-800/80 flex items-center justify-between text-xs">
                            <div>
                                ${pkg.image ? `
                                    <button type="button" onclick="downloadPackageImage('${pkg.image}', '${escapeHtml(pkg.title)}',${pkg.price || 0}, event)"
                                        class="px-3.5 py-1.5 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-300 font-bold transition flex items-center gap-1.5 active:scale-95 shadow">
                                        <i class="fa-solid fa-download text-xs text-cyan-400"></i><span>Tải ảnh</span>
                                    </button>
                                ` : '<span></span>'}
                            </div>
                            <div>
                                <button type="button" onclick="copyPackageQuote('${pkg.id}')"
                                    class="px-3.5 py-1.5 rounded-lg bg-cyan-950/50 border border-cyan-400 text-cyan-300 font-bold transition flex items-center gap-1.5 active:scale-95 shadow-[0_0_12px_rgba(0,240,255,0.25)]">
                                    <i class="fa-solid fa-share-nodes text-xs text-cyan-400"></i> Gửi khách
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.openWuwaModal = function() {
            editingPkgId = null;
            document.getElementById('wuwaForm').reset();
            uploadedBase64Image = "";
            document.getElementById('imgPreviewContainer').classList.add('hidden');
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.disabled = false;
            document.getElementById('submitBtnText').textContent = "LƯU GÓI NẠP LÊN SUPABASE";
            document.getElementById('modalHeading').innerHTML = `THÊM GÓI NẠP // <span class="text-zinc-100">BẢNG GIÁ</span>`;
            document.getElementById('wuwaModal').classList.replace('hidden', 'flex');
        };

        window.closeWuwaModal = function() {
            editingPkgId = null;
            document.getElementById('wuwaModal').classList.replace('flex', 'hidden');
        };

        window.openEditModal = function(id) {
            const pkg = wuwaPackages.find(w => w.id === id);
            if (!pkg) return;
            editingPkgId = id;
            document.getElementById('pkgTitle').value = pkg.title || '';
            document.getElementById('pkgPrice').value = pkg.price || '';
            uploadedBase64Image = pkg.image || '';

            const container = document.getElementById('imgPreviewContainer');
            const preview = document.getElementById('imgPreview');
            if (uploadedBase64Image) {
                preview.src = uploadedBase64Image;
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }

            document.getElementById('submitBtnText').textContent = "CẬP NHẬT GÓI NẠP";
            document.getElementById('modalHeading').innerHTML = `CHỈNH SỬA // <span class="text-cyan-300">${escapeHtml(pkg.title)}</span>`;
            document.getElementById('wuwaModal').classList.replace('hidden', 'flex');
        };

        window.handleImageUpload = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxW = 800;
                    const scale = Math.min(1, maxW / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    uploadedBase64Image = canvas.toDataURL('image/jpeg', 0.82);

                    const container = document.getElementById('imgPreviewContainer');
                    const preview = document.getElementById('imgPreview');
                    preview.src = uploadedBase64Image;
                    container.classList.remove('hidden');
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const title = document.getElementById('pkgTitle').value.trim();
            const price = parseFloat(document.getElementById('pkgPrice').value) || 0;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> ĐANG LƯU...`;

            try {
                const payload = {
                    title: title,
                    price: price,
                    image: uploadedBase64Image || null
                };

                if (editingPkgId) {
                    await _supabase.from('wuwa_packages').update(payload).eq('id', editingPkgId);
                    showToast(`Đã cập nhật ${title}!`);
                } else {
                    const newId = 'wpkg_' + Date.now();
                    await _supabase.from('wuwa_packages').insert([{ id: newId, ...payload, created_at: new Date().toISOString() }]);
                    showToast(`Đã thêm ${title} thành công!`);
                }
                closeWuwaModal();
                await fetchPackages();
            } catch (err) {
                showToast("Lỗi khi lưu vào Supabase!", true);
            } finally {
                submitBtn.disabled = false;
                document.getElementById('submitBtnText').textContent = editingPkgId ? "CẬP NHẬT GÓI NẠP" : "LƯU GÓI NẠP LÊN SUPABASE";
            }
        };

        window.promptDelete = function(id, title) {
            pendingDeleteId = id;
            document.getElementById('deletePkgLabel').textContent = title;
            document.getElementById('deleteModal').classList.replace('hidden', 'flex');
        };

        window.closeDeleteModal = function() {
            pendingDeleteId = null;
            document.getElementById('deleteModal').classList.replace('flex', 'hidden');
        };

        window.executeDelete = async function() {
            if (!pendingDeleteId) return;
            const id = pendingDeleteId;
            closeDeleteModal();
            try {
                await _supabase.from('wuwa_packages').delete().eq('id', id);
                showToast("Đã xóa vĩnh viễn gói nạp!");
                await fetchPackages();
            } catch (err) {
                showToast("Không thể xóa gói nạp!", true);
            }
        };

        window.copyPackageQuote = function(id) {
            const pkg = wuwaPackages.find(w => w.id === id);
            if (!pkg) return;
            const priceFormatted = (parseFloat(pkg.price) || 0) > 0 ? (parseFloat(pkg.price) || 0).toLocaleString('vi-VN') + ' VNĐ' : 'Liên hệ';
            let text = `⚡ BẢNG GIÁ NẠP GAME WUTHERING WAVES\n`;
            text += `📦 Gói: ${pkg.title}\n`;
            text += `💰 Giá: ${priceFormatted}\n`;
            text += `---------------------------------\n`;
            text += `Hỗ trợ nạp uy tín, nhanh gọn, an toàn 100%! Nhắn ngay để lên đơn nhé ❤️`;
            navigator.clipboard.writeText(text);
            showToast("Đã sao chép báo giá gửi khách!");
        };

        window.downloadPackageImage = function(imageUrl, title, price, event) {
            if (event) event.stopPropagation();
            if (!imageUrl) return;
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = `${title}.jpg`;
            link.click();
            showToast("Đã tải ảnh gói nạp!");
        };

        window.openImgViewer = function(src) {
            document.getElementById('modalViewerImage').src = src;
            document.getElementById('imgModal').classList.remove('hidden');
        };
        window.closeImgViewer = function() { document.getElementById('imgModal').classList.add('hidden'); };

        window.handleSearch = function() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            document.getElementById('clearSearchBtn').classList.toggle('hidden', !q);
            const filtered = wuwaPackages.filter(w => (w.title || '').toLowerCase().includes(q));
            renderList(filtered);
        };

        window.clearSearch = function() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').classList.add('hidden');
            renderList(wuwaPackages);
        };

        function showToast(msg, isErr = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.className = `fixed bottom-5 right-5 z-[80] translate-y-0 opacity-100 transition-all duration-300 px-5 py-3 rounded-xl border-2 text-sm flex items-center space-x-3 ${isErr ? 'bg-black/95 border-yellow-500 text-yellow-300' : 'bg-[#0c0c16]/95 border-cyan-400 text-white'}`;
            setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchPackages();
            _supabase.channel('public:wuwa')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'wuwa_packages' }, () => fetchPackages())
                .subscribe();
        });
    </script>
</body>
</html>
